codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 3
    wait_for_ci: true
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: 'condensed_header, diff, flags, condensed_files, condensed_footer'
  after_n_builds: 3
  require_head: true
flags:
  linux:
    carryforward: false
  windows:
    carryforward: false
  macos:
    carryforward: false
