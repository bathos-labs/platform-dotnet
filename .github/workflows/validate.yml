name: Native validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  validation:
    name: Common validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep tool pins in sync with Taskfile.yml and CONTRIBUTING.md.
      REMARK_PACKAGES: >-
        --package=remark-cli@12.0.1 --package=remark-gfm@4.0.1
        --package=remark-validate-links@13.1.0 --package=remark-lint-no-undefined-references@5.0.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git show --format= --check HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check Markdown formatting
        # Keep the pin in sync with Taskfile.yml and CONTRIBUTING.md.
        run: npx --yes prettier@3.9.10 --check "**/*.md"
      - name: Check local documentation links
        run: >-
          npx --yes $REMARK_PACKAGES remark --rc-path .remarkrc.cjs
          --ignore-path .prettierignore --frail --no-stdout --no-color .
      - name: Verify documentation link-checking configuration
        run: npx --yes $REMARK_PACKAGES node eng/CheckDocumentationLinks.test.cjs
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Bathos.Platform.slnx --locked-mode
      - name: Check C# formatting
        run: dotnet format Bathos.Platform.slnx --verify-no-changes --no-restore

  native:
    name: Native (${{ matrix.os }})
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet --info
      - name: Install headless portal test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dbus-daemon python3-dbus python3-gi
      - run: dotnet restore Bathos.Platform.slnx --locked-mode
      - run: dotnet build Bathos.Platform.slnx --configuration Release --no-restore
      - name: Test with line and branch coverage
        run: >-
          dotnet test --solution Bathos.Platform.slnx --configuration Release --no-build
          --coverlet --coverlet-output-format cobertura --coverlet-include '[Bathos.Platform*]*'
          --coverlet-exclude '[Bathos.Platform.Tests]*' --coverlet-exclude '[Bathos.Platform.TestApplication]*'
          --coverlet-exclude-by-file '**/obj/**' --coverlet-exclude-by-attribute GeneratedCodeAttribute
          --report-xunit-trx --results-directory artifacts/test-results
      - name: Require inspectable shipping-code coverage
        run: dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-coverage artifacts/test-results artifacts/coverage/coverage.cobertura.xml
      - run: dotnet pack Bathos.Platform.slnx --configuration Release --no-build --no-restore --output artifacts/packages
      - run: dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-packages artifacts/packages
      - name: Retain native test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-results-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified release packages
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Complete native coverage upload
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-results-*
          path: artifacts/native
      - name: Require all three platform reports before uploading any
        run: |
          for os in ubuntu-24.04 windows-2025 macos-15; do
            test -s "artifacts/native/native-results-$os/coverage/coverage.cobertura.xml"
          done
      - name: Upload Linux coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: artifacts/native/native-results-ubuntu-24.04/coverage/coverage.cobertura.xml
          flags: linux
          disable_search: true
          fail_ci_if_error: true
      - name: Upload Windows coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: artifacts/native/native-results-windows-2025/coverage/coverage.cobertura.xml
          flags: windows
          disable_search: true
          fail_ci_if_error: true
      - name: Upload macOS coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: artifacts/native/native-results-macos-15/coverage/coverage.cobertura.xml
          flags: macos
          disable_search: true
          fail_ci_if_error: true
