# https://taskfile.dev/docs/reference/schema/
version: '3'

vars:
  # Keep the CI pin and CONTRIBUTING.md commands in sync when upgrading.
  PRETTIER_VERSION: '3.9.10'
  REMARK_PACKAGES: >-
    --package=remark-cli@12.0.1 --package=remark-gfm@4.0.1
    --package=remark-validate-links@13.1.0 --package=remark-lint-no-undefined-references@5.0.2

# Keep restore/build/test operations sequential; Task's deps run concurrently.
tasks:
  default:
    desc: List development and release commands
    silent: true
    cmds:
      - task --list

  restore:
    desc: Restore locked NuGet dependencies
    cmds:
      - dotnet restore Bathos.Platform.slnx --locked-mode

  build:
    desc: Restore and build Release with analyzers
    cmds:
      - task: restore
      - dotnet build Bathos.Platform.slnx --configuration Release --no-restore

  format:
    desc: Apply C# and Markdown formatting
    cmds:
      - task: docs:format
      - task: code:format

  code:format:
    desc: Apply C# formatting
    cmds:
      - task: restore
      - dotnet format Bathos.Platform.slnx --no-restore

  format:check:
    desc: Verify C# and Markdown formatting without edits
    cmds:
      - task: docs:check
      - task: code:check

  code:check:
    desc: Verify C# formatting without edits
    cmds:
      - task: restore
      - dotnet format Bathos.Platform.slnx --verify-no-changes --no-restore

  docs:format:
    desc: Wrap Markdown prose and align tables
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --write "**/*.md"

  docs:check:
    desc: Verify Markdown formatting without edits
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --check "**/*.md"

  docs:links:
    desc: Check local Markdown files, reference links, and heading anchors without HTTP requests
    cmds:
      - >-
        npx --yes {{.REMARK_PACKAGES}} remark --rc-path .remarkrc.cjs
        --ignore-path .prettierignore --frail --no-stdout --no-color .

  docs:links:test:
    desc: Verify link-checker configuration against disposable valid and broken Markdown
    cmds:
      - npx --yes {{.REMARK_PACKAGES}} node eng/CheckDocumentationLinks.test.cjs

  lint:
    desc: Check whitespace, documentation links, and formatting with locked restore
    cmds:
      - git diff --check
      - git diff --cached --check
      - task: docs:check
      - task: docs:links
      - task: code:check

  test:
    desc: Build and run native tests on this host
    cmds:
      - task: build
      - dotnet test --solution Bathos.Platform.slnx --configuration Release --no-build

  test:coverage:
    desc: Run standalone tests with inspectable line and branch coverage for this host
    cmds:
      - task: build
      - cmd: dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- clean-test-results
      - >-
        dotnet test --solution Bathos.Platform.slnx --configuration Release --no-build
        --coverlet --coverlet-output-format cobertura --coverlet-include '[Bathos.Platform*]*'
        --coverlet-exclude '[Bathos.Platform.Tests]*' --coverlet-exclude '[Bathos.Platform.TestApplication]*'
        --coverlet-exclude-by-file '**/obj/**' --coverlet-exclude-by-attribute GeneratedCodeAttribute
        --report-xunit-trx --results-directory artifacts/test-results
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-coverage artifacts/test-results artifacts/coverage/coverage.cobertura.xml

  pack:
    desc: Build NuGet packages and symbols locally (does not publish)
    cmds:
      - task: build
      - dotnet pack Bathos.Platform.slnx --configuration Release --no-build --no-restore --output artifacts/packages

  packages:check:
    desc: Pack and verify metadata, examples, isolated consumption, and publishing
    cmds:
      - task: pack
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-packages artifacts/packages

  packages:aot:
    desc: Verify packages and published consumers including Native AOT (requires a native toolchain)
    cmds:
      - task: pack
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-packages artifacts/packages --native-aot

  release:test:
    desc: Verify release guards against isolated local Git repositories (does not publish)
    cmds:
      - dotnet build eng/Bathos.Platform.Build --configuration Release --property:RestoreLockedMode=true
      - node eng/CheckReleasePolicy.test.cjs

  check:
    desc: Run the complete local validation sequence, including package consumption
    cmds:
      - task: lint
      - task: docs:links:test
      - dotnet build Bathos.Platform.slnx --configuration Release --no-restore
      - node eng/CheckReleasePolicy.test.cjs
      - dotnet test --solution Bathos.Platform.slnx --configuration Release --no-build
      - dotnet pack Bathos.Platform.slnx --configuration Release --no-build --no-restore --output artifacts/packages
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --no-build -- verify-packages artifacts/packages

  eng:sampler:
    desc: Launch the engineering-only sampler validation harness (Linux remains experimental)
    cmds:
      - task: build
      - dotnet run --project eng/Bathos.Platform.Sampler --configuration Release --no-build

  eng:sampler:smoke:
    desc: Check the macOS/Windows sampler dispatcher and shutdown without opening the picker
    cmds:
      - task: build
      - dotnet run --project eng/Bathos.Platform.Sampler --configuration Release --no-build -- --smoke

  release:check:
    desc: Check release branch, version, and changelog, then validate locally (TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --property:RestoreLockedMode=true -- verify-tag {{.TAG | shellQuote}}
      - task: check

  release:tag:
    desc: Validate and create an annotated local release tag; does not push (TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: Commit the version, changelog, lockfiles, and any other changes before tagging.
    cmds:
      - task: release:check
        vars:
          TAG: '{{.TAG}}'
      - git tag -a {{.TAG | shellQuote}} -m {{printf "Release %s" .TAG | shellQuote}}

  release:push:
    desc: Push one existing release tag to origin, triggering public NuGet publication (TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - dotnet run --project eng/Bathos.Platform.Build --configuration Release --property:RestoreLockedMode=true -- verify-tag {{.TAG | shellQuote}} --remote
      - git push origin {{printf "refs/tags/%s:refs/tags/%s" .TAG .TAG | shellQuote}}
